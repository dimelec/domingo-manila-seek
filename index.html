<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CCTV · Control Técnico V3.1</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#687386;--line:#dce3ed;--blue:#2563eb;--good:#edf9f0;--bad:#fff0f0;--warn:#fff7e8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}.app{max-width:900px;margin:auto;min-height:100vh}
header{background:#101827;color:white;padding:17px 16px 13px;position:sticky;top:0;z-index:5}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}
h1{font-size:19px;margin:0}header small{opacity:.7}.logout{border:1px solid #506079;background:transparent;color:white;border-radius:8px;padding:8px}
main{padding:14px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.card{background:white;border:1px solid var(--line);border-radius:12px;padding:13px}.k{font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase}.v{font-size:23px;font-weight:900;margin-top:4px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:14px 0}.tab{border:1px solid var(--line);background:white;border-radius:9px;padding:10px;font-weight:800}.tab.on{background:#263247;color:white}
.panel{display:none}.panel.on{display:block}.filter{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:16px;margin-bottom:9px}
.item{background:white;border:1px solid var(--line);border-radius:11px;padding:12px;margin:8px 0;cursor:pointer}.itemtop{display:flex;justify-content:space-between;gap:10px}.meta{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.4}
.state{font-size:10px;font-weight:900;border-radius:999px;padding:4px 7px;white-space:nowrap;background:#edf2f7}.state.bad{background:var(--bad);color:#9a3131}.state.good{background:var(--good);color:#316e41}.state.warn{background:var(--warn);color:#866017}
.btn{width:100%;border:0;border-radius:10px;padding:12px;font-weight:800;background:var(--blue);color:white;margin-top:8px}.btn.secondary{background:#e8edf5;color:#263247}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:10;padding:14px;overflow:auto}.modal.on{display:flex;align-items:flex-end;justify-content:center}.sheet{background:white;border-radius:16px 16px 0 0;padding:17px;width:min(680px,100%);max-height:92vh;overflow:auto}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:8px}.choice button{padding:15px;border:1px solid var(--line);border-radius:11px;background:white;font-weight:900}.choice .sel.good{background:var(--good);border-color:#86ba92}.choice .sel.bad{background:var(--bad);border-color:#d28b8b}
textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:10px;padding:11px;font:inherit;margin-top:8px}.history{border-left:3px solid #d7deea;padding-left:15px;margin-left:6px}.event{position:relative;background:white;border:1px solid var(--line);border-radius:10px;padding:10px;margin:9px 0}.event:before{content:"";position:absolute;left:-22px;top:14px;width:10px;height:10px;border-radius:50%;background:#64748b}
.note{font-size:12px;color:var(--muted);margin:8px 0}.empty{text-align:center;padding:24px;color:var(--muted)}
@media(max-width:650px){.summary{grid-template-columns:repeat(2,1fr)}header{position:static}}
</style></head><body><div class="app">
<header><div class="top"><div><h1>CCTV · Control técnico</h1><small>V3.1 · Tarea → Jornada → Tramo → CCTV</small></div><button class="logout">Cerrar sesión</button></div></header>
<main>
<div class="summary"><div class="card"><div class="k">Por inspeccionar</div><div class="v">0</div></div><div class="card"><div class="k">No conformes</div><div class="v">0</div></div><div class="card"><div class="k">Reinspección</div><div class="v">0</div></div><div class="card"><div class="k">Revisados hoy</div><div class="v">0</div></div></div>
<div class="tabs"><button class="tab on" data-p="pend">PENDIENTES</button><button class="tab" data-p="reins">REINSPECCIÓN</button><button class="tab" data-p="hist">HISTORIA</button></div>
<section id="pend" class="panel on"><div class="empty">Conectando con el Motor…</div></section>
<section id="reins" class="panel"><div class="empty">Conectando…</div></section>
<section id="hist" class="panel"><div class="empty">Conectando…</div></section>
</main></div>
<div class="modal" id="modal"><div class="sheet"><div class="k">Inspección CCTV</div><h2 id="mt">Tramo</h2><div class="card" id="ctx"></div>
<h3>Resultado técnico</h3><div class="choice"><button id="apto">APTO</button><button id="noapto">NO APTO</button></div>
<textarea id="obs" placeholder="Observación técnica. Obligatoria para NO APTO."></textarea>
<div class="note" id="rule">El resultado pertenece al tramo presentado dentro de su Tarea/Jornada.</div>
<button class="btn" id="save" disabled>REGISTRAR RESULTADO</button><button class="btn secondary" id="cancel">Cancelar</button></div></div>
<script>
const API='https://script.google.com/macros/s/AKfycbwDy1V9_-gn0p4fNwVFnQJKJgYewW5ZfjmkRJpV8ckUwXzXWExAIgbuw0x-dUXORV4T/exec';
let DATA={pendientes:[],reinspeccion:[],historia:[]},active=null,result=null;
function jsonp(params){return new Promise((resolve,reject)=>{const cb='cctv_'+Date.now()+'_'+Math.random().toString(36).slice(2);const sc=document.createElement('script');const timer=setTimeout(()=>done(new Error('Sin respuesta del Motor')),15000);function done(err,val){clearTimeout(timer);delete window[cb];sc.remove();err?reject(err):resolve(val)}window[cb]=v=>done(null,v);sc.onerror=()=>done(new Error('No fue posible conectar con el Motor'));sc.src=API+'?'+new URLSearchParams({...params,callback:cb,_:Date.now()});document.head.appendChild(sc)})}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function card(x,kind){const state=kind==='reins'?'REINSPECCIÓN':'SIN INSPECCIÓN';const cls=kind==='reins'?'bad':'warn';return `<div class="item inspect" data-id="${esc(x.idCCTV)}"><div class="itemtop"><b>Tramo ${esc(x.tramo)}</b><span class="state ${cls}">${state}</span></div><div class="meta">${esc(x.idTarea||'Sin Tarea')} · ${esc(x.barrio||'')}<br>${esc(x.placa)} · ${Number(x.ml||0)} ML · presentado ${esc(x.fechaPresentacion||'')}</div></div>`}
function bind(){document.querySelectorAll('.inspect').forEach(x=>x.onclick=()=>openInspection(x.dataset.id))}
function render(){const r=DATA.resumen||{};DATA.pendientes=Array.isArray(DATA.pendientes)?DATA.pendientes:[];DATA.reinspeccion=Array.isArray(DATA.reinspeccion)?DATA.reinspeccion:[];DATA.historia=Array.isArray(DATA.historia)?DATA.historia:[];document.querySelectorAll('.summary .v')[0].textContent=r.porInspeccionar??0;document.querySelectorAll('.summary .v')[1].textContent=r.noConformesActuales??0;document.querySelectorAll('.summary .v')[2].textContent=r.reinspeccion??0;document.querySelectorAll('.summary .v')[3].textContent=r.revisadosHoy??0;document.getElementById('pend').innerHTML=`<input class="filter" id="filter" placeholder="Buscar tramo, Tarea, placa o barrio…">${DATA.pendientes.length?DATA.pendientes.map(x=>card(x,'pend')).join(''):'<div class="empty">No hay tramos pendientes de inspección.</div>'}<div class="note">CCTV verifica tramos presentados. No crea Tareas ni selecciona contratista.</div>`;document.getElementById('reins').innerHTML=DATA.reinspeccion.length?DATA.reinspeccion.map(x=>card(x,'reins')).join(''):'<div class="empty">No hay reinspecciones pendientes.</div>';document.getElementById('hist').innerHTML=`<div class="history">${DATA.historia.length?DATA.historia.map(x=>{const rr=x.resultado==='CONFORME'?'APTO':(x.resultado==='NO_CONFORME'?'NO APTO':(x.resultado==='CONFORME_POR_OMISION'?'CIERRE POR OMISIÓN':x.resultado||'SIN RESULTADO'));return `<div class="event"><b>${esc(x.tramo)} · ${esc(rr)}</b><div class="meta">${esc(x.fechaResultado||'')} · ${esc(x.idTarea||'Sin Tarea trazable')} · ${esc(x.placa||'')}${x.observacion?'<br>'+esc(x.observacion):''}</div></div>`}).join(''):'<div class="empty">Aún no hay historia CCTV.</div>'}</div><div class="note">Una reinspección favorable cambia el estado actual, pero no borra la no conformidad histórica.</div>`;bind();const f=document.getElementById('filter');if(f)f.oninput=e=>{const q=e.target.value.toLowerCase();document.querySelectorAll('#pend .item').forEach(x=>x.style.display=x.textContent.toLowerCase().includes(q)?'block':'none')}}
async function load(){try{const d=await jsonp({action:'cctvVista'});if(!d.ok)throw new Error(d.error||'Respuesta inválida');DATA=d;render()}catch(e){document.getElementById('pend').innerHTML=`<div class="empty"><b>Sin conexión con el Motor</b><br>${esc(e.message)}</div>`}}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.getElementById(b.dataset.p).classList.add('on')});
function findItem(id){const p=Array.isArray(DATA.pendientes)?DATA.pendientes:[];const r=Array.isArray(DATA.reinspeccion)?DATA.reinspeccion:[];return [...p,...r].find(x=>x.idCCTV===id)}
function openInspection(id){active=findItem(id);if(!active)return;result=null;document.getElementById('mt').textContent='Tramo '+active.tramo;document.getElementById('ctx').innerHTML=`<b>${active.origen==='RELIMPIEZA'?'REINSPECCIÓN':'INSPECCIÓN'}</b><div class="meta">${esc(active.idTarea)} · ${esc(active.barrio)}<br>${esc(active.placa)} · ${Number(active.ml||0)} ML</div>`;document.getElementById('obs').value='';['apto','noapto'].forEach(i=>document.getElementById(i).className='');validate();document.getElementById('modal').classList.add('on')}
document.getElementById('apto').onclick=()=>choose('APTO');document.getElementById('noapto').onclick=()=>choose('NO APTO');function choose(r){result=r;document.getElementById('apto').className=r==='APTO'?'sel good':'';document.getElementById('noapto').className=r==='NO APTO'?'sel bad':'';validate()}function validate(){const obs=document.getElementById('obs').value.trim();document.getElementById('save').disabled=!result||(result==='NO APTO'&&!obs)}document.getElementById('obs').oninput=validate;document.getElementById('cancel').onclick=()=>document.getElementById('modal').classList.remove('on');
document.querySelector('.logout').textContent=sessionStorage.getItem('cctvToken')?'Cambiar token':'Ingresar token';document.querySelector('.logout').onclick=()=>{const t=prompt('Token del usuario CCTV:');if(t){sessionStorage.setItem('cctvToken',t.trim());document.querySelector('.logout').textContent='Cambiar token'}};
document.getElementById('save').onclick=async()=>{if(document.getElementById('save').disabled)return;let token=sessionStorage.getItem('cctvToken')||'';if(!token){token=prompt('Token del usuario CCTV:')||'';if(!token)return;sessionStorage.setItem('cctvToken',token.trim())}const btn=document.getElementById('save');btn.disabled=true;btn.textContent='REGISTRANDO…';try{const d=await jsonp({action:'cctvRegistrar',idCCTV:active.idCCTV,resultado:result,observacion:document.getElementById('obs').value.trim(),token,actionId:'CCTV-'+active.idCCTV+'-'+Date.now(),fechaHoraEvento:new Date().toISOString()});if(!d.ok)throw new Error(d.error||'No se pudo registrar');document.getElementById('modal').classList.remove('on');await new Promise(r=>setTimeout(r,350));await load()}catch(e){alert(e.message);if(/token|autorizado/i.test(e.message))sessionStorage.removeItem('cctvToken')}finally{btn.textContent='REGISTRAR RESULTADO';validate()}};
load();
</script></body></html>
